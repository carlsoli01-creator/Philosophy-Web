<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Noösphere: a living map of philosophy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Schibsted+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light dark;
  --bg:#e6ecef; --bg2:#f5f8f9; --ink:#14232b; --ink2:#4d636b;
  --panel:rgba(248,251,252,.9); --line:rgba(20,35,43,.15); --edge:38,62,74;
  --out:#b8690a; --in:#0b7f86; --opp:#c2413f; --halo:rgba(240,245,247,.9);
  --accent:#0f5f74; --tipbg:rgba(252,253,253,.98); --neb:.17; --shadow:0 10px 34px rgba(20,35,43,.16); --hover:rgba(20,35,43,.07);
  --f-display:'Gloock',Georgia,'Times New Roman',serif;
  --f-ui:'Schibsted Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0b151a; --bg2:#14252c; --ink:#e7efeb; --ink2:#93a9b0;
    --panel:rgba(16,29,35,.88); --line:rgba(231,239,235,.14); --edge:168,196,206;
    --out:#f2b84b; --in:#5cd0d6; --opp:#ff7b78; --halo:rgba(11,21,26,.88);
    --accent:#f2b84b; --tipbg:rgba(19,36,44,.98); --neb:.14; --shadow:0 12px 40px rgba(0,0,0,.45); --hover:rgba(231,239,235,.08);
  }
}
:root[data-theme="dark"]{
  --bg:#0b151a; --bg2:#14252c; --ink:#e7efeb; --ink2:#93a9b0;
  --panel:rgba(16,29,35,.88); --line:rgba(231,239,235,.14); --edge:168,196,206;
  --out:#f2b84b; --in:#5cd0d6; --opp:#ff7b78; --halo:rgba(11,21,26,.88);
  --accent:#f2b84b; --tipbg:rgba(19,36,44,.98); --neb:.14; --shadow:0 12px 40px rgba(0,0,0,.45); --hover:rgba(231,239,235,.08);
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;position:relative;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
#c:active{cursor:grabbing}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.top{position:absolute;top:14px;left:16px;right:16px;display:flex;gap:12px;align-items:flex-start;pointer-events:none;z-index:5}
.top>*{pointer-events:auto}
.brand{min-width:0}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,3.2vw,40px);line-height:1.05;margin:0;letter-spacing:-.01em;text-shadow:0 0 14px var(--bg),0 0 4px var(--bg)}
.brand p{margin:5px 0 0;font-size:13px;color:var(--ink2);text-shadow:0 0 10px var(--bg)}
.searchwrap{position:relative;margin-left:14px;width:min(330px,100%)}
#q{width:100%;box-sizing:border-box;padding:10px 14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;font-size:15px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#q::placeholder{color:var(--ink2)}
.results{position:absolute;top:100%;left:0;right:0;margin:6px 0 0;padding:4px;list-style:none;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:10}
.res{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;background:none;border:0;border-radius:8px;text-align:left;cursor:pointer}
.res:hover,.res.active{background:var(--hover)}
.res .rt{margin-left:auto;font-size:12px;color:var(--ink2)}
.dot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--c)}
.tools{margin-left:auto;display:flex;gap:8px}
.btn{padding:9px 13px;background:var(--panel);border:1px solid var(--line);border-radius:10px;font-size:14px;cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);white-space:nowrap}
.btn:hover{background:var(--hover)}

.legend{position:absolute;left:16px;bottom:16px;width:240px;max-height:calc(100% - 150px);overflow:auto;box-sizing:border-box;padding:10px 8px 8px;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:4}
.legend h2{margin:4px 8px 4px;font-size:13px;font-weight:600;color:var(--ink2)}
.legend .sec+.sec{margin-top:8px;padding-top:6px;border-top:1px solid var(--line)}
.chipbtn{display:flex;align-items:center;gap:9px;width:100%;box-sizing:border-box;padding:5px 8px;background:none;border:0;border-radius:8px;font-size:13.5px;text-align:left;cursor:pointer}
.chipbtn:hover{background:var(--hover)}
.chipbtn .n{margin-left:auto;font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.chipbtn[aria-pressed="false"]{opacity:.42}
.chipbtn[aria-pressed="false"] .dot{background:transparent;box-shadow:inset 0 0 0 1.6px var(--c)}
.chipbtn svg{flex:none}
.key{display:flex;align-items:center;gap:9px;padding:4px 8px;font-size:13px;color:var(--ink2)}
.reset{margin:0 8px 2px auto;display:block;background:none;border:0;padding:2px 4px;font-size:12.5px;color:var(--accent);cursor:pointer;text-decoration:underline}

#panel{position:absolute;top:64px;right:16px;bottom:16px;width:348px;box-sizing:border-box;overflow:auto;padding:18px 18px 22px;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);z-index:6}
#panel .close{position:absolute;top:10px;right:10px;width:32px;height:32px;border:0;border-radius:50%;background:none;cursor:pointer;font-size:20px;line-height:1;color:var(--ink2)}
#panel .close:hover{background:var(--hover)}
.kind{display:flex;align-items:center;gap:8px;margin-right:34px;font-size:13px;color:var(--ink2)}
.name{font-family:var(--f-display);font-weight:400;font-size:29px;line-height:1.1;margin:6px 0 10px;letter-spacing:-.005em}
.desc{margin:0 0 4px;font-size:14.5px;line-height:1.5;color:var(--ink)}
.psec h3{display:flex;align-items:center;gap:8px;margin:16px 0 7px;font-size:13px;font-weight:600;color:var(--ink2)}
.psec h3::before{content:"";width:16px;height:0;border-top:2px solid var(--m,var(--ink2))}
.psec.opp h3::before{border-top-style:dashed}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:4px 11px 4px 9px;background:none;border:1px solid var(--line);border-radius:999px;font-size:13px;cursor:pointer}
.chip:hover{background:var(--hover)}
.chip.static{cursor:default}
.chip.static:hover{background:none}
.chip .dot{width:8px;height:8px}
.trace{margin-top:20px;padding-top:14px;border-top:1px solid var(--line)}
.trace label{display:block;margin-bottom:7px;font-size:13px;font-weight:600;color:var(--ink2)}
.trace .searchwrap{margin:0;width:100%}
.trace input{width:100%;box-sizing:border-box;padding:9px 12px;background:transparent;border:1px solid var(--line);border-radius:10px;font-size:14px}
.trace .results{top:auto;bottom:100%;margin:0 0 6px}

#pathbar{position:absolute;left:272px;right:16px;bottom:16px;max-height:34%;overflow:auto;box-sizing:border-box;padding:12px 16px 14px;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:5}
body.panel-open #pathbar{right:380px}
#pathbar .ph{display:flex;align-items:center;gap:12px;margin-bottom:9px}
#pathbar .ph strong{font-family:var(--f-display);font-weight:400;font-size:18px}
#pathbar .ph .btn{margin-left:auto;padding:5px 10px;font-size:13px}
#chain{display:flex;flex-wrap:wrap;align-items:center;gap:7px 3px}
#chain .rel{padding:0 5px;font-size:12.5px;color:var(--accent);font-style:italic}

#hint{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);padding:8px 16px;background:var(--panel);border:1px solid var(--line);border-radius:999px;font-size:13.5px;color:var(--ink2);pointer-events:none;transition:opacity .7s;z-index:3;white-space:nowrap}
#hint.gone{opacity:0}
#fail{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;z-index:20;background:var(--bg)}

.btn.ico{width:38px;padding:9px 0;text-align:center;font-size:19px;line-height:1}
.chiprow{display:flex;align-items:center;border-radius:8px}
.chiprow:hover{background:var(--hover)}
.chiprow .chipbtn:hover{background:none}
.chiprow.off .go{opacity:.42}
.chiprow.off .dot{background:transparent;box-shadow:inset 0 0 0 1.6px var(--c)}
.eye{flex:none;width:30px;height:28px;padding:0;display:grid;place-items:center;background:none;border:0;border-radius:8px;color:var(--ink2);cursor:pointer}
.eye:hover{color:var(--ink)}
.eye .slash{display:none}
.eye[aria-pressed="false"] .slash{display:block}
.eye[aria-pressed="false"]{opacity:.7}
.back{display:block;margin:0 34px 8px 0;padding:0;background:none;border:0;font-size:13px;color:var(--accent);cursor:pointer;text-decoration:underline;text-align:left}
.meta{margin:6px 0 0;font-size:13px;color:var(--ink2)}
[data-tip]{cursor:inherit}
#tip{position:fixed;left:0;top:0;z-index:30;max-width:272px;box-sizing:border-box;padding:10px 13px 11px;background:var(--tipbg);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);pointer-events:none;font-size:13.5px;line-height:1.45}
#tip .tk{display:flex;align-items:center;gap:7px;margin-bottom:4px;font-size:12px;color:var(--ink2)}
#tip .tk .dot{width:8px;height:8px}
#tip .tt{margin-bottom:4px;font-family:var(--f-display);font-size:17px;line-height:1.15}
#tip .tb{color:var(--ink)}
@media (max-width:759px){
  .top{flex-wrap:wrap;top:10px;left:12px;right:12px;gap:8px}
  .brand{flex:1 1 0}
  .tools{margin-left:0}
  .tools .btn{padding:8px 10px;font-size:13px}
  .btn.ico{display:none}
  .searchwrap{order:3;flex:1 1 100%;width:100%;margin-left:0}
  .legend{left:0;right:0;bottom:0;width:auto;max-height:none;display:flex;gap:4px;overflow-x:auto;overflow-y:hidden;padding:8px 10px;border-radius:16px 16px 0 0;border-width:1px 0 0}
  .legend .sec{display:flex;gap:4px;margin:0;padding:0;border:0!important}
  .legend h2,.legend .keys,.legend .reset{display:none}
  .legend .chipbtn{width:auto;flex:none;white-space:nowrap;border:1px solid var(--line);border-radius:999px;padding:6px 11px}
  .legend .chipbtn .n{display:none}
  .legend .chiprow{flex:none;border:1px solid var(--line);border-radius:999px}
  .legend .chiprow .chipbtn{border:0;border-radius:999px 0 0 999px;padding:6px 4px 6px 11px}
  .legend .chiprow .eye{width:34px;height:32px}
  #panel{top:auto;left:8px;right:8px;bottom:8px;width:auto;max-height:54%;padding:16px}
  body.panel-open .legend{display:none}
  #pathbar{left:8px;right:8px;bottom:60px;max-height:30%}
  body.panel-open #pathbar{right:8px;bottom:calc(54% + 16px)}
  #hint{bottom:66px;white-space:normal;text-align:center;width:max-content;max-width:88%}
}
@media (prefers-reduced-motion:reduce){#hint{transition:none}}
</style>
</head>
<body>
<canvas id="c" role="img" aria-label="Interactive network of philosophical concepts, schools and thinkers. Use the search box to explore it as a list."></canvas>

</header>

<aside id="panel" hidden aria-label="Details"></aside>
<div id="pathbar" hidden>

/* ===== GRAPH BUILDER ===== */
function buildGraph(){
  const nodes = [], byId = new Map(), missing = [], dupes = [];
  const add = (id, group, type) => {
    if (byId.has(id)) { dupes.push(id); return; }
    const n = {id, group, type}; byId.set(id, n); nodes.push(n);
  };
  add("Philosophy", "R", "root");
  for (const g of ORDER) add(FIELD_NAMES[g], g, "field");
  for (const g of ORDER) for (const type of ["concept","school","thinker"])
    for (const name of NODES[g][type].split("|")) add(name, g, type);

  const links = [], seen = new Set();
  const addLink = (a, b, rel) => {
    if (a === b) return;
    if (!byId.has(a)) { missing.push(a); return; }
    if (!byId.has(b)) { missing.push(b); return; }
    const key = rel === "infl" ? a+"|"+b+"|"+rel : [a,b].sort().join("|")+"|"+rel;
    if (seen.has(key)) return;
    seen.add(key);
    links.push({source:a, target:b, rel});
  };
  for (const g of ORDER) addLink("Philosophy", FIELD_NAMES[g], "part");
  for (const n of nodes) if (n.type === "concept" || n.type === "school") addLink(FIELD_NAMES[n.group], n.id, "part");

  const RE = /^(.+?)\s+([>=~])\s+(.+)$/;
  for (let line of EDGES.split("\n")) {
    line = line.trim();
    if (!line || line[0] === "#") continue;
    const m = RE.exec(line);
    if (!m) { missing.push("BAD LINE: " + line); continue; }
    const rel = m[2] === ">" ? "infl" : m[2] === "~" ? "opp" : "rel";
    const src = m[1].trim();
    for (const t of m[3].split(",")) addLink(src, t.trim(), rel);
  }
  return {nodes, links, missing, dupes};
}

Clive Bell: Argued that "significant form" defines art.
Deduction: Reasoning where conclusions follow necessarily from premises.
Validity: An argument is valid when its conclusion follows from its premises.
Soundness: A valid argument with true premises.

Paradox: A seemingly sound argument that leads to a contradiction or absurd conclusion.

Dialectic: A method of reasoning through opposing views toward a fuller truth.
Law of Non-Contradiction: Nothing can be both true and false in the same respect.
Infinity: Endlessness, and the strange sizes of infinite collections.
Set Theory: The mathematical theory of collections, a foundation for mathematics.
Propositional Logic: The logic of whole statements combined by "and", "or", "not" and "if".
Predicate Logic: Logic that adds quantifiers like "all" and "some" and reasons about objects.
Modal Logic: The logic of necessity and possibility.
Formal Systems: Sets of symbols and rules for deriving theorems mechanically.
Computability: What can be calculated by an algorithm, and the limits of computation.
Paraconsistent Logic: Logics that tolerate contradictions without collapsing into triviality.
Meaning: What words and sentences convey, and how they do so.
Reference: How words pick out things in the world.
Sense and Reference: Frege's distinction between what a term denotes and how it presents it.
Speech Acts: Using language to do things: promise, warn, name, command.
Language Games: Wittgenstein's idea that meaning comes from use within shared activities.
Private Language Argument: Wittgenstein's argument that a language only one person could understand is impossible.
Semantics: The study of meaning and truth conditions.
Pragmatics: How context shapes what speakers mean.
Linguistic Turn: The twentieth-century shift toward treating philosophical problems as problems about language.
Verification Principle: A statement is meaningful only if it can be verified by experience or is true by definition.
Rigid Designation: A name that refers to the same thing in every possible world.
Differance: Derrida's coinage: meaning arises by difference and endless deferral.
Semiotics: The study of signs and how they generate meaning.
Metaphor: Understanding one thing in terms of another; central to thought and language.
Vagueness: Terms with blurry boundaries, like "bald" or "tall".
Implicature: What a speaker suggests beyond what is literally said.
Analytic Philosophy: Tradition emphasizing clarity, logic and careful argument about language and concepts.
Continental Philosophy: Broad European tradition around phenomenology, existentialism, hermeneutics and critical theory.
Logical Positivism: The Vienna Circle view that only verifiable or logical statements are meaningful.
Logicism: Mathematics can be reduced to logic.
Intuitionism: Mathematical truths are mental constructions; unprovable statements are not automatically true or false.
Mathematical Platonism: Mathematical objects exist independently of us.
Mathematical Formalism: Mathematics is the manipulation of symbols by rules.
Ordinary Language Philosophy: Philosophical puzzles come from misusing everyday words, so study their ordinary use.
Structuralism: Meaning comes from relations within systems, such as language or myth.
Poststructuralism: Questions the stability of the structures and meanings that structuralism assumed.
Postmodernism: Skepticism toward grand narratives, objective truth and fixed identities.
Deconstruction: Reading texts to show how they undermine their own claims and hierarchies.
Hermeneutics: The theory of interpretation, of texts and of human life.
Frege: Founded modern logic and distinguished sense from reference.
Russell: British logician and public intellectual who found the paradox that broke naive set theory.
Wittgenstein: Austrian philosopher who dissolved philosophical problems as confusions of language.
Carnap: Vienna Circle leader who sought a logical construction of science.
Gödel: Logician who proved the incompleteness theorems.
Tarski: Logician who gave a formal definition of truth.
Saussure: Swiss linguist who founded structural linguistics.
J.L. Austin: British philosopher who showed how speaking is a form of doing.
Kripke: Reshaped modal logic and argued for necessary a posteriori truths.
Chomsky: Linguist who argued for an innate universal grammar.
Derrida: French founder of deconstruction.
Grice: Explained how conversation relies on implicit cooperative norms.
A.J. Ayer: Popularized logical positivism in Language, Truth and Logic.
Gadamer: Hermeneutic philosopher who saw understanding as a fusion of horizons.
Lévi-Strauss: Anthropologist who applied structuralism to kinship and myth.
George Boole: Invented the algebraic logic that underlies computing.
Turing: Founded computer science and asked whether machines can think.
Ricoeur: French hermeneutic philosopher of narrative, metaphor and selfhood.
Consciousness: Subjective awareness; what it is like to experience anything.
Qualia: The felt qualities of experience, like the redness of red.
Mind-Body Problem: How mental states relate to the physical brain and body.

Intentionality: The way mental states are about, or directed at, things.
Other Minds: How we can know that other beings have minds at all.
Chinese Room: Searle's argument that running a program is not the same as understanding.
Artificial Intelligence: Machines performing tasks that require intelligence, and whether they could truly think.
Self: The subject of experience: what it is, and whether it exists at all.
Philosophical Zombie: A being physically identical to you but with no inner experience.
Mental Causation: How thoughts and feelings can cause physical action.
Extended Mind: The mind can stretch into tools and environment, like notebooks or phones.
Introspection: Observing one's own mental states, and how reliable that is.
Mary's Room: Jackson's thought experiment about a scientist who knows every physical fact about color but has never seen it.
Turing Test: A machine passes if it can converse indistinguishably from a human.
Multiple Realizability: The same mental state could be realized in different physical systems.
Embodiment: Thought and experience shaped by having a living body.
Lifeworld: Husserl's term for the pre-scientific world of everyday experience.
Epoché: Suspending judgment about the external world in order to study experience itself.
Functionalism: Mental states are defined by what they do, not by what they are made of.
Physicalism: Everything, including mind, is physical.
Behaviorism: Psychology should study observable behavior, not inner states.
Epiphenomenalism: Mental events are byproducts of brain activity that cause nothing themselves.
Panpsychism: Mind or experience is a basic feature of all matter.
Eliminative Materialism: Everyday mental concepts are outdated and will be replaced by neuroscience.
Embodied Cognition: Thinking depends on the body and its interaction with the world.
Phenomenology: Careful study of experience as it appears from the first-person view.
Identity Theory: Mental states are identical with brain states.
Property Dualism: One substance, the brain, has both physical and irreducibly mental properties.
Husserl: Founded phenomenology, the study of conscious experience.
Franz Brentano: Revived the concept of intentionality as the mark of the mental.
Merleau-Ponty: French phenomenologist who put the lived body at the center of perception.
Searle: Philosopher of mind and language who devised the Chinese Room.
Nagel: Asked "What is it like to be a bat?" to argue that subjectivity resists reduction.
Chalmers: Named the hard problem of consciousness.
Dennett: Argued that consciousness is a product of evolved brain processes, not a mystery.
Putnam: Developed functionalism and the brain-in-a-vat argument, later rejecting parts of both.
Gilbert Ryle: Attacked the "ghost in the machine" picture of the mind.
Paul Churchland: Champion of eliminative materialism.
Frank Jackson: Devised the Mary's Room argument.
Andy Clark: Argued with Chalmers that the mind extends beyond the skull.
Falsifiability: A theory is scientific only if some observation could show it wrong.
Paradigm Shift: A revolutionary change in the basic framework of a science.
Explanation: What makes something understood in science: causes, laws or mechanisms.
Underdetermination: Evidence can fit more than one theory equally well.
Scientific Method: The systematic use of observation, hypothesis and testing.
Occam's Razor: Prefer the simplest explanation that fits the facts.
Laws of Nature: Regularities that describe or govern how the world behaves.
Probability: Measures of chance or degrees of belief.
Theory-Ladenness: Observations are shaped by the theories the observer holds.
Demarcation Problem: How to tell science from pseudoscience.
Incommensurability: Successive paradigms cannot be neatly compared by a shared standard.
Confirmation: How evidence supports a hypothesis.
Natural Selection: Darwin's mechanism of evolution, which explains design without a designer.
Anthropic Principle: The universe must permit observers, since we observe it.
Pragmatic Maxim: Peirce's rule: the meaning of a concept is its practical effects.
Fallibilism: Any belief, however well supported, could turn out to be false.
Naturalized Epistemology: Study knowledge as a natural process, using the methods of science.
Scientific Realism: Successful theories are approximately true, even about unobservable things.

Reductionism: Complex phenomena can be explained by simpler underlying parts.
Naturalism: Only natural things and the methods of science are needed to explain the world.
Pragmatism: Truth and meaning are tied to practical consequences and inquiry.
Bayesianism: Rational belief is degrees of confidence updated by Bayes' rule.
Constructive Empiricism: Science aims at empirical adequacy, not truth about unobservables.
Vitalism: Living things have a special life force beyond physics and chemistry.
Neopragmatism: Rorty's update: drop the search for mirroring reality; value solidarity and conversation.
Positivism: Only knowledge from observation and science is legitimate.
Galileo: Founded modern physics with experiment and mathematics; condemned by the Church.
Auguste Comte: Founded positivism and sociology.
Peirce: Founded pragmatism and the theory of signs.
William James: Brought pragmatism to a wide audience and studied religious experience.
John Dewey: Pragmatist who tied education, democracy and inquiry together.
Popper: Proposed falsifiability and defended the open society.
Thomas Kuhn: Introduced paradigm shifts in The Structure of Scientific Revolutions.

Paul Feyerabend: Argued that science has no single method: "anything goes".
Bas van Fraassen: Defended constructive empiricism.
Thomas Bayes: Eighteenth-century minister whose theorem underlies Bayesian inference.
William of Ockham: Medieval Franciscan behind the principle of parsimony.
Charles Darwin: Proposed evolution by natural selection.
Rorty: Neopragmatist who argued that philosophy cannot mirror nature.

Mysticism: Direct experience of the divine or ultimate reality.
Negative Theology: Describing God only by what God is not.
Transcendence: Being beyond the ordinary world and its limits.
Immanence: Being present within the world.
Divine Command Theory: Moral rightness is whatever God commands.
Death: Mortality as a source of meaning, fear or freedom.

Anxiety: For existentialists, the mood that reveals our freedom and the nothingness around it.

Bad Faith: Sartre's term for self-deception that denies one's own freedom.
Authenticity: Living in accord with one's own choices rather than social roles.
Existence Precedes Essence: Sartre: we exist first, then define ourselves by what we do.
Dasein: Heidegger's term for human being: the being who asks about being.
Thrownness: Being placed into a world and situation we did not choose.
Being-toward-Death: Heidegger: awareness of mortality shapes an authentic life.
Eternal Recurrence: Nietzsche's test: could you will your life repeating forever?
Will to Power: Nietzsche's idea of a drive to grow, create and overcome.
Übermensch: Nietzsche's "overman": one who creates new values.
Amor Fati: Love of fate: embracing everything that happens.
Death of God: Nietzsche's claim that belief in God has collapsed, leaving a crisis of values.
Master-Slave Morality: Nietzsche's contrast between values of strength and values born of resentment.
Ressentiment: Resentful envy that reshapes values to devalue the strong.
Nihilism: The view that life, morality or values lack objective meaning.
Leap of Faith: Kierkegaard: commitment to God beyond what reason can justify.
The Other: Another person as a separate consciousness who challenges and defines the self.
The Gaze: Sartre's idea that being seen turns us into objects for others.
I-Thou: Buber's mode of full mutual encounter, as opposed to treating things as objects.
Existentialism: Existence, freedom and responsibility come before any fixed human nature.
Existential Phenomenology: Studies lived human existence using phenomenological description.
Absurdism: Life has no inherent meaning; live fully anyway, in revolt.
Pessimism: Suffering outweighs happiness and existence is fundamentally bad.
Theism: Belief in a personal God who acts in the world.
Atheism: Denial that any god exists.
Agnosticism: Suspending belief because God's existence cannot be known.
Pantheism: God is identical with the universe.
Deism: God created the world but does not intervene in it.
Fideism: Faith does not need, or is opposed to, reason.
Islamic Philosophy: Medieval Arabic thought that preserved and extended Greek philosophy.
Augustine: Christian thinker of grace, time, the will and the origin of evil.
Anselm: Archbishop who devised the ontological argument.
Aquinas: Scholastic who fused Aristotle with Christian theology and gave five proofs of God.
Avicenna: Persian polymath who distinguished essence from existence.
Averroes: Andalusian commentator who made Aristotle central to Islamic and Latin thought.
Al-Ghazali: Islamic theologian who attacked philosophers' claims about causation and eternity.
Maimonides: Jewish rabbi and philosopher who reconciled Aristotle with Torah.
Meister Eckhart: German mystic who spoke of the God beyond God.
Pascal: French mathematician who argued for faith, famously through his wager.
Kierkegaard: Danish thinker who stressed individual faith and existential choice.
Nietzsche: German thinker who announced the death of God and called for revaluing values.
Schopenhauer: Saw reality as blind will and life as suffering, relieved by art and compassion.
Heidegger: Asked the question of being through human existence.
Sartre: French existentialist who taught radical freedom and responsibility.
Simone de Beauvoir: Existentialist who wrote The Second Sex, arguing "one is not born a woman".
Camus: French writer who explored the absurd and revolt.
Dostoevsky: Russian novelist who dramatized faith, doubt, freedom and guilt.
Karl Jaspers: German existentialist psychiatrist who wrote of limit situations.
Martin Buber: Jewish philosopher of dialogue and I-Thou relations.
Dao: The Way: the natural, ineffable course of things.
Wu Wei: Effortless action in accord with the Dao.
Yin-Yang: Complementary opposites whose interplay makes the world.
Ren: Confucian benevolence or humaneness, the chief virtue.
Ritual (Li): Confucian rites and propriety that shape a moral community.
Principle (Li): The Neo-Confucian pattern or principle that structures things.
Junzi: The exemplary person in Confucianism.
Filial Piety: Respect and care for parents and ancestors.
Unity of Knowledge and Action: Wang Yangming: true knowing already involves acting.
Butterfly Dream: Zhuangzi's story: was he a man dreaming a butterfly, or the reverse?
Dharma: Cosmic law, duty, or the Buddha's teaching.
Karma: Actions have consequences that shape future lives.
Samsara: The cycle of birth, death and rebirth.
Nirvana: Liberation from craving and from the cycle of rebirth.
Anatta: The Buddhist teaching that there is no permanent self.
Sunyata: Emptiness: nothing has independent, inherent existence.
Dependent Origination: Everything arises in dependence on other conditions.
Middle Way: Avoiding the extremes of indulgence and asceticism.
Four Noble Truths: The Buddha's diagnosis: suffering, its cause, its end and the path.
Brahman: The ultimate reality in Vedanta.
Atman: The true self, which Advaita identifies with Brahman.
Maya: The illusion that veils the unity of reality.
Moksha: Liberation from the cycle of rebirth.
Ahimsa: Non-violence toward all beings.
Zazen: Seated meditation in Zen.
Mindfulness: Attentive, nonjudgmental awareness of the present moment.
Pure Experience: Nishida's term for experience before the split of subject and object.
Ubuntu: "I am because we are": personhood arises through community.
Wabi-sabi: Japanese aesthetic of imperfection, transience and simplicity.
Confucianism: Ethical tradition of virtue, ritual and social harmony.
Daoism: Tradition of living in accord with the Dao, spontaneity and simplicity.
Buddhism: A path to end suffering through insight, ethics and meditation.
Advaita Vedanta: Non-dual Hindu school in which Atman is Brahman.
Madhyamaka: Nagarjuna's school of emptiness and the middle way.
Yogacara: The Buddhist "mind-only" school of consciousness.
Zen: Buddhist school of direct insight through meditation.

Mohism: Impartial care and consequentialist ethics.

Samkhya: Classical Indian dualism of spirit and matter.
Nyaya: Indian school of logic and epistemology.
Charvaka: Indian materialist school that rejected karma and rebirth.
Confucius: Chinese teacher who taught virtue, ritual and humane government.
Laozi: Legendary author of the Daodejing.
Zhuangzi: Daoist writer of paradox, humor and perspective.
Mencius: Confucian who argued that human nature is good.
Xunzi: Confucian who argued that human nature is bad and needs ritual training.
Mozi: Taught impartial concern and opposed war and extravagance.
Han Fei: Legalist who stressed law, statecraft, and rewards and punishments.

Nagarjuna: Buddhist philosopher of emptiness.

<script>
(function(){
'use strict';
const $ = id => document.getElementById(id);
if (typeof d3 === 'undefined') { $('fail').hidden = false; return; }

const FUI = "'Schibsted Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif";
const FDISP = "'Gloock', Georgia, 'Times New Roman', serif";
const TYPE_LABEL = {root:'Root', field:'Field', concept:'Concept', school:'School', thinker:'Thinker'};
const TYPE_NOUN  = {concept:'Concept', school:'School or theory', thinker:'Thinker'};
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const isNarrow = () => window.innerWidth < 760;
const norm = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();

/* ---------- graph ---------- */
const {nodes, links} = buildGraph();
const byId = new Map(nodes.map(n => [n.id, n]));
for (const k in GROUPS) { const h = GROUPS[k].color; GROUPS[k].rgb = [1,3,5].map(i => parseInt(h.slice(i,i+2),16)).join(','); }

const nb = new Map(nodes.map(n => [n.id, []]));
for (const l of links) {
  nb.get(l.source).push({id:l.target, rel:l.rel, dir:'out'});
  nb.get(l.target).push({id:l.source, rel:l.rel, dir:'in'});
}
nodes.forEach(n => {
  const e = nb.get(n.id);
  n.deg = e.filter(x => x.rel !== 'part').length;
  n.total = e.length;
  n.key = norm(n.id);
  n.r = n.type==='root' ? 20
      : n.type==='field' ? 12 + Math.min(6, n.total/12)
      : n.type==='school' ? 4.8 + Math.sqrt(n.deg)*.9
      : n.type==='concept' ? 3.8 + Math.sqrt(n.deg)*.85
      : 4 + Math.sqrt(n.deg)*.8;
  n.ls = n.type==='root' ? {f:`400 25px ${FDISP}`, fs:25}
       : n.type==='field' ? {f:`400 18px ${FDISP}`, fs:18}
       : n.type==='school' ? {f:`600 13.5px ${FUI}`, fs:13.5}
       : {f:`500 13px ${FUI}`, fs:13};
  n.desc = n.type==='root' ? FIELD_DESC.R : n.type==='field' ? FIELD_DESC[n.group] : (DESC[n.id] || '');
  n.vis = true;
});
const realLinkCount = links.filter(l => l.rel !== 'part').length;
$('stats').textContent = `A living map of philosophy. ${nodes.length - 11} ideas, ${realLinkCount.toLocaleString()} connections.`;

/* ---------- layout ---------- */
function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed>>>15, 1|seed); t = t + Math.imul(t ^ t>>>7, 61|t) ^ t; return ((t ^ t>>>14)>>>0)/4294967296; }; }
const rand = rng(11);
const RING = 640, anchor = {R:{x:0,y:0}};
ORDER.forEach((g,i) => { const a = -Math.PI/2 + i*2*Math.PI/ORDER.length; anchor[g] = {x:RING*Math.cos(a), y:RING*Math.sin(a)}; });
nodes.forEach(n => { const a = anchor[n.group]; n.x = a.x + (rand()-.5)*260; n.y = a.y + (rand()-.5)*260; });
const root = byId.get('Philosophy'); root.x = 0; root.y = 0; root.fx = 0; root.fy = 0;

const DIST = {part:76, rel:56, infl:62, opp:80};
const STR  = {part:.05, rel:.2, infl:.16, opp:.04};
const sim = d3.forceSimulation(nodes)
  .force('link', d3.forceLink(links).id(d => d.id)
     .distance(l => l.source.type==='root' ? RING : DIST[l.rel])
     .strength(l => l.source.type==='root' ? .3 : STR[l.rel]))
  .force('charge', d3.forceManyBody().strength(d => d.type==='root' ? 0 : d.type==='field' ? -380 : d.type==='school' ? -150 : -76).distanceMax(380))
  .force('collide', d3.forceCollide(d => d.r + 4.2).strength(.85))
  .force('x', d3.forceX(d => anchor[d.group].x).strength(d => d.type==='field' ? .5 : d.type==='root' ? 0 : .06))
  .force('y', d3.forceY(d => anchor[d.group].y).strength(d => d.type==='field' ? .5 : d.type==='root' ? 0 : .06))
  .velocityDecay(.38).alphaDecay(.028);
sim.stop();
for (let i = 0; i < 420; i++) sim.tick();

const pairKey = (a,b) => a < b ? a+'|'+b : b+'|'+a;
const nodeLinks = new Map(nodes.map(n => [n.id, []]));
const linkIndex = new Map();
for (const l of links) {
  nodeLinks.get(l.source.id).push(l); nodeLinks.get(l.target.id).push(l);
  const k = pairKey(l.source.id, l.target.id);
  if (!linkIndex.has(k)) linkIndex.set(k, []);
  linkIndex.get(k).push(l);
  l.vis = true;
}
const RELPRI = {infl:0, rel:1, opp:2, part:3};
function findLink(a, b){
  const arr = linkIndex.get(pairKey(a.id, b.id)); if (!arr) return null;
  return arr.slice().sort((x,y) => RELPRI[x.rel]-RELPRI[y.rel])[0];
}
const PRI = {school:0, concept:1, thinker:2, field:3, root:4};
const drawOrder = nodes.slice().sort((a,b) => PRI[a.type]-PRI[b.type]);
const byDegree  = nodes.filter(n => n.type!=='root' && n.type!=='field').sort((a,b) => b.deg-a.deg);

/* ---------- state ---------- */
const canvas = $('c'), ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1, tf = d3.zoomIdentity;
let selected = null, hovered = null, focusNode = null, hiSet = null, hiLinks = [], pathNodes = null;
let dragging = false, showPart = true;
const navStack = [];
const hiddenGroups = new Set(), hiddenTypes = new Set();
let introT = reduceMotion ? 1 : 0, introStart = 0;
let T = {};

function readTheme(){
  const cs = getComputedStyle(document.documentElement), g = n => cs.getPropertyValue(n).trim();
  T = {bg:g('--bg'), bg2:g('--bg2'), ink:g('--ink'), ink2:g('--ink2'), edge:g('--edge'), out:g('--out'), inn:g('--in'), opp:g('--opp'), halo:g('--halo'), accent:g('--accent'), neb:parseFloat(g('--neb'))||.15};
}
readTheme();

/* ---------- drawing ---------- */
let pending = false;
function requestDraw(){ if (pending) return; pending = true; requestAnimationFrame(frame); }
function frame(now){
  pending = false;
  if (introT < 1) { if (!introStart) introStart = now; introT = Math.min(1, (now - introStart)/1500); }
  draw();
  if (introT < 1) requestDraw();
}
const measureCache = new Map();
function textW(font, s){ const key = font+'|'+s; let w = measureCache.get(key); if (w === undefined){ ctx.font = font; w = ctx.measureText(s).width; measureCache.set(key, w); } return w; }
function lodMin(k){ return k < .5 ? 99 : k < .75 ? 11 : k < 1 ? 7 : k < 1.4 ? 5 : k < 2 ? 3 : k < 2.8 ? 1 : 0; }

function draw(){
  const k = tf.k, rs = Math.pow(k, -.3), ease = 1 - Math.pow(1-introT, 3), sc = .35 + .65*ease;
  const dim = !!hiSet;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.globalAlpha = 1;
  ctx.fillStyle = T.bg; ctx.fillRect(0,0,W,H);
  const bg = ctx.createRadialGradient(W*.5,H*.5,0,W*.5,H*.5,Math.max(W,H)*.7);
  bg.addColorStop(0,T.bg2); bg.addColorStop(1,T.bg);
  ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);

  ctx.setTransform(DPR*k,0,0,DPR*k,tf.x*DPR,tf.y*DPR);

  /* nebulae */
  const sums = {};
  for (const n of nodes){ if (!n.vis || n.group==='R') continue; const s = sums[n.group] || (sums[n.group] = {x:0,y:0,c:0}); s.x += n.x; s.y += n.y; s.c++; }
  for (const g in sums){
    const s = sums[g], cx = s.x/s.c, cy = s.y/s.c, R = 80 + Math.sqrt(s.c)*26;
    const gr = ctx.createRadialGradient(cx,cy,0,cx,cy,R);

/* ---------- search ---------- */
function makeSearch(input, list, onPick){
  let items = [], active = -1;
  const render = () => {
    list.innerHTML = '';
    items.forEach((n, i) => {
      const li = document.createElement('li'); li.setAttribute('role','option');
      const b = document.createElement('button'); b.type = 'button'; b.className = 'res' + (i===active ? ' active' : ''); b.tabIndex = -1;
      const d = document.createElement('span'); d.className = 'dot'; d.style.setProperty('--c', GROUPS[n.group].color);
      const a = document.createElement('span'); a.textContent = n.id;
      const t = document.createElement('span'); t.className = 'rt'; t.textContent = TYPE_LABEL[n.type];
      b.append(d, a, t); b.addEventListener('pointerdown', ev => { ev.preventDefault(); pick(n); });
      li.appendChild(b); list.appendChild(li);
    });
    list.hidden = !items.length;
  };
  const pick = n => { items = []; render(); input.value = ''; input.blur(); onPick(n); };
  input.addEventListener('input', () => {
    const q = norm(input.value.trim()); active = -1;
    if (!q){ items = []; render(); return; }
    const scored = [];
    for (const n of nodes){
      if (n.type === 'root') continue;
      const i = n.key.indexOf(q); if (i < 0) continue;
      const score = (i === 0 ? 0 : n.key[i-1] === ' ' ? 1 : 2) * 100 - Math.min(n.deg, 60);
      scored.push([score, n]);
    }
    scored.sort((a,b) => a[0]-b[0]); items = scored.slice(0,8).map(x => x[1]); render();
  });

    if (e.key === 'ArrowDown'){ e.preventDefault(); active = Math.min(items.length-1, active+1); render(); }
    else if (e.key === 'ArrowUp'){ e.preventDefault(); active = Math.max(0, active-1); render(); }
    else if (e.key === 'Enter'){ if (items.length) pick(items[active >= 0 ? active : 0]); }
    else if (e.key === 'Escape'){ items = []; render(); input.blur(); }
  });

}

window.addEventListener('keydown', e => {
  const tag = document.activeElement && document.activeElement.tagName;

  else if (e.key === '0'){ $('btnFit').click(); }
  else if (e.key === 'ArrowLeft'){ e.preventDefault(); panBy(step, 0); }
  else if (e.key === 'ArrowRight'){ e.preventDefault(); panBy(-step, 0); }
  else if (e.key === 'ArrowUp'){ e.preventDefault(); panBy(0, step); }

    if (prev.has(b.id)){ const out = []; let c = b.id; while (c){ out.push(byId.get(c)); c = prev.get(c); } return out.reverse(); }

}

  if (l.rel === 'infl') return 'An influence link: the earlier idea or thinker shaped the later one.';
  if (l.rel === 'opp') return 'A contrast link: rival or opposing positions.';
  if (l.rel === 'part') return 'A hub link: a concept or school and the field it belongs to.';
  return 'A relatedness link: closely connected ideas, with no claim about direction.';
}
function setPath(path){
  pathNodes = path;
  const a = path[0], b = path[path.length-1];
  $('pathTitle').textContent = `${a.id} to ${b.id} in ${path.length-1} step${path.length===2?'':'s'}`;
  const chain = $('chain'); chain.innerHTML = '';
  path.forEach((n, i) => {
    if (i > 0){ const s = document.createElement('span'); s.className = 'rel'; const lk = findLink(path[i-1], n); s.textContent = relText(lk, path[i-1]); s.dataset.tip = relTip(lk); chain.appendChild(s); }
    chain.appendChild(chip(n, () => { select(n, {focus:false}); }));
  });
  $('pathbar').hidden = false;
  $('live').textContent = 'Path found: ' + path.map(n => n.id).join(', ');
  updateFocus();
  fitNodes(path, 800, 2.4);
}
function clearPath(){ pathNodes = null; $('pathbar').hidden = true; updateFocus(); }
$('btnClearPath').addEventListener('click', clearPath);
$('btnSurprise').addEventListener('click', () => {
  const pool = nodes.filter(n => n.type !== 'root' && n.type !== 'field' && n.vis);
  let best = null;
  for (let i = 0; i < 400; i++){
    const a = pool[Math.floor(Math.random()*pool.length)], b = pool[Math.floor(Math.random()*pool.length)];
    if (a === b || a.group === b.group) continue;
    const p = shortestPath(a, b);
    if (p && p.length >= 4 && p.length <= 6){ best = p; break; }
    if (p && !best) best = p;
  }
  if (best){ select(null); setPath(best); }
});
$('btnZoomIn').addEventListener('click', () => zoomAt(W/2, H/2, 1.5));
$('btnZoomOut').addEventListener('click', () => zoomAt(W/2, H/2, 1/1.5));
$('btnFit').addEventListener('click', () => { clearPath(); select(null); fitNodes(nodes, 700); });

/* ---------- filters ---------- */
function applyFilters(){
  for (const n of nodes) n.vis = n.type === 'root' || (!hiddenGroups.has(n.group) && !hiddenTypes.has(n.type));
  for (const l of links) l.vis = l.source.vis && l.target.vis && (l.rel !== 'part' || showPart);
  if (selected && !selected.vis) select(null);
  if (hovered && !hovered.vis) hovered = null;
  if (pathNodes && pathNodes.some(n => !n.vis)) clearPath();
  const any = hiddenGroups.size || hiddenTypes.size || !showPart;
  const rb = document.querySelector('#legend .reset'); if (rb) rb.hidden = !any;
  updateFocus();
}
(function buildLegend(){
  const L = $('legend');
  const counts = {}; nodes.forEach(n => { if (n.type !== 'field' && n.type !== 'root') counts[n.group] = (counts[n.group]||0)+1; });
  const tcounts = {}; nodes.forEach(n => { tcounts[n.type] = (tcounts[n.type]||0)+1; });
  const sec1 = document.createElement('div'); sec1.className = 'sec'; sec1.innerHTML = '<h2>Fields</h2>';
  const toggles = [];
  const EYE = '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 8s2.4-4.5 6.5-4.5S14.5 8 14.5 8 12.1 12.5 8 12.5 1.5 8 1.5 8z" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="8" cy="8" r="2" fill="currentColor"/><path class="slash" d="M2.5 13.5 13.5 2.5" stroke="currentColor" stroke-width="1.8"/></svg>';
  for (const g of ORDER){
    const row = document.createElement('div'); row.className = 'chiprow'; row.style.setProperty('--c', GROUPS[g].color);
    const go = document.createElement('button'); go.type = 'button'; go.className = 'chipbtn go';
    go.innerHTML = '<span class="dot"></span><span class="t"></span><span class="n"></span>';
    go.querySelector('.dot').style.setProperty('--c', GROUPS[g].color);
    go.querySelector('.t').textContent = GROUPS[g].name; go.querySelector('.n').textContent = counts[g];
    go.dataset.tipTitle = GROUPS[g].name; go.dataset.tip = FIELD_DESC[g] + ' Click to fly to this field.';
    const eye = document.createElement('button'); eye.type = 'button'; eye.className = 'eye'; eye.setAttribute('aria-pressed','true');
    eye.setAttribute('aria-label', 'Show or hide ' + GROUPS[g].name); eye.innerHTML = EYE;
    eye.dataset.tip = 'Hide or show everything in ' + GROUPS[g].name + '.';
    const setGroup = on => { if (on) hiddenGroups.delete(g); else hiddenGroups.add(g); row.classList.toggle('off', !on); eye.setAttribute('aria-pressed', on ? 'true' : 'false'); applyFilters(); };
    go.addEventListener('click', () => {
      if (hiddenGroups.has(g)) setGroup(true);
      const hub = byId.get(FIELD_NAMES[g]);
      clearPath(); select(hub, {focus:false});
      fitNodes(nodes.filter(n => n.group === g && n.vis), 800, 2.2);
    });
    eye.addEventListener('click', () => setGroup(hiddenGroups.has(g)));
    row.append(go, eye); toggles.push({b:eye, row, kind:'g', key:g}); sec1.appendChild(row);
  }
  const sec2 = document.createElement('div'); sec2.className = 'sec'; sec2.innerHTML = '<h2>Show</h2>';
  const icons = {
    concept:'<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="4.5" fill="currentColor"/></svg>',
    school:'<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 .5 11.5 6 6 11.5.5 6z" fill="currentColor"/></svg>',
    thinker:'<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="4.2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>',
    hub:'<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M1 10 11 2" stroke="currentColor" stroke-width="1.4" opacity=".55"/></svg>'
  };
  const tdefs = [
    ['concept','Concepts',tcounts.concept,'Ideas, problems and arguments, drawn as filled circles. Click to hide or show them.'],
    ['school','Schools and theories',tcounts.school,'Movements, traditions and theories, drawn as diamonds. Click to hide or show them.'],
    ['thinker','Thinkers',tcounts.thinker,'People, drawn as rings. Click to hide or show them.'],
    ['hub','Lines to fields','','The faint lines tying each concept and school to its field. Hide them to see only the meaningful connections.']];
  for (const [key, name, cnt, tip] of tdefs){
    const b = document.createElement('button'); b.type = 'button'; b.className = 'chipbtn'; b.setAttribute('aria-pressed','true');
    b.innerHTML = icons[key] + '<span class="t"></span><span class="n"></span>';
    b.querySelector('.t').textContent = name; b.querySelector('.n').textContent = cnt;
    b.dataset.tipTitle = name; b.dataset.tip = tip;
    b.addEventListener('click', () => {
      let on;
      if (key === 'hub'){ showPart = !showPart; on = showPart; }
      else { on = hiddenTypes.has(key); on ? hiddenTypes.delete(key) : hiddenTypes.add(key); }
      b.setAttribute('aria-pressed', on ? 'true' : 'false'); applyFilters();
    });
    toggles.push({b, kind:'t', key}); sec2.appendChild(b);
  }
  const sec3 = document.createElement('div'); sec3.className = 'sec keys';
  sec3.innerHTML = '<h2>Lines</h2>' +
    '<div class="key" data-tip-title="Influenced" data-tip="An arrow runs from the earlier idea or thinker to the one it shaped. When you select a node, amber lines are what it influenced and teal lines are what influenced it."><svg width="26" height="10" aria-hidden="true"><path d="M1 5h18" stroke="var(--out)" stroke-width="2"/><path d="M25 5 18 1.5v7z" fill="var(--out)"/></svg>Influenced</div>' +
    '<div class="key" data-tip-title="Contrasts with" data-tip="A dashed red line joins rival or opposing positions, such as rationalism and empiricism."><svg width="26" height="10" aria-hidden="true"><path d="M1 5h24" stroke="var(--opp)" stroke-width="2" stroke-dasharray="4 3"/></svg>Contrasts with</div>' +
    '<div class="key" data-tip-title="Related" data-tip="A plain line joins closely connected ideas, with no claim about which came first."><svg width="26" height="10" aria-hidden="true"><path d="M1 5h24" stroke="var(--ink2)" stroke-width="1.5"/></svg>Related</div>';
  const reset = document.createElement('button'); reset.type = 'button'; reset.className = 'reset'; reset.textContent = 'Show everything'; reset.hidden = true; reset.dataset.tip = 'Brings back every hidden field, node type and line.';
  reset.addEventListener('click', () => {
    hiddenGroups.clear(); hiddenTypes.clear(); showPart = true;
    toggles.forEach(t => { t.b.setAttribute('aria-pressed','true'); if (t.row) t.row.classList.remove('off'); }); applyFilters();
  });
  L.append(sec1, sec2, sec3, reset);
})();

/* ---------- tooltips ---------- */
const tipEl = $('tip');
let tipTimer = null, touchTimer = null, tipHideTimer = null, longPressed = false;
function kindText(n){ return n.type==='root' ? 'The whole discipline' : n.type==='field' ? 'A field of philosophy' : `${TYPE_NOUN[n.type]} in ${GROUPS[n.group].name}`; }
function setNodeTip(el, n){ if (!n.desc) return; el.dataset.tip = n.desc; el.dataset.tipTitle = n.id; el.dataset.tipKind = kindText(n); el.dataset.tipDot = GROUPS[n.group].color; }
function uiRects(){
  const out = [];
  document.querySelectorAll('.top .brand,.top .searchwrap,.top .tools,#panel,#pathbar,#legend').forEach(el => {
    if (el.hidden) return; const r = el.getBoundingClientRect(); if (r.width > 0 && r.height > 0) out.push(r);
  });
  return out;
}
function overlapArea(a, b){
  const w = Math.min(a.right, b.right) - Math.max(a.left, b.left), h = Math.min(a.bottom, b.bottom) - Math.max(a.top, b.top);
  return (w > 0 && h > 0) ? w*h : 0;
}
/* Puts the tooltip as close to the anchor as possible without covering it or any other piece of the interface. */
function placeTip(anchor, host){
  const vw = document.documentElement.clientWidth || window.innerWidth, vh = window.innerHeight, gap = 10, m = 8;
  const tw = tipEl.offsetWidth, th = tipEl.offsetHeight, h = host || anchor;
  const cx = (anchor.left + anchor.right)/2, cy = (anchor.top + anchor.bottom)/2;
  const avoid = uiRects();
  const xs = [h.right + gap, h.left - gap - tw, cx - tw/2, anchor.right + gap, anchor.left - gap - tw];
  const ys = [cy - th/2, h.bottom + gap, h.top - gap - th, anchor.bottom + gap, anchor.top - gap - th];
  for (const r of avoid){ xs.push(r.left - gap - tw, r.right + gap); ys.push(r.top - gap - th, r.bottom + gap); }
  let best = null;
  for (const cxp of xs) for (const cyp of ys){
    const x = Math.min(Math.max(m, cxp), vw - tw - m), y = Math.min(Math.max(m, cyp), vh - th - m);
    const rect = {left:x, top:y, right:x+tw, bottom:y+th};
    let pen = (Math.abs(x-cxp) + Math.abs(y-cyp)) * 300;
    for (const r of avoid) pen += overlapArea(rect, r) * 10;
    pen += (overlapArea(rect, anchor) + overlapArea(rect, h)) * 40;
    pen += Math.hypot(x + tw/2 - cx, y + th/2 - cy) * 20;
    if (!best || pen < best.pen) best = {x, y, pen};
  }
  tipEl.style.left = best.x + 'px'; tipEl.style.top = best.y + 'px';
}
function showTip(info, anchor, host){
  tipEl.innerHTML = '';
  if (info.kind){
    const k = document.createElement('div'); k.className = 'tk';
    if (info.dot){ const d = document.createElement('span'); d.className = 'dot'; d.style.setProperty('--c', info.dot); k.appendChild(d); }
    const s = document.createElement('span'); s.textContent = info.kind; k.appendChild(s); tipEl.appendChild(k);
  }
  if (info.title){ const t = document.createElement('div'); t.className = 'tt'; t.textContent = info.title; tipEl.appendChild(t); }
  const b = document.createElement('div'); b.className = 'tb'; b.textContent = info.text; tipEl.appendChild(b);
  tipEl.style.visibility = 'hidden'; tipEl.hidden = false; tipEl.style.left = '0px'; tipEl.style.top = '0px';
  placeTip(anchor, host);
  tipEl.style.visibility = 'visible';
}
function hideTip(){ clearTimeout(tipTimer); clearTimeout(tipHideTimer); tipEl.hidden = true; }
function tipForEl(el){
  if (!el || !el.dataset.tip) return;
  const host = el.closest('#panel,#legend,#pathbar,.top .tools,.top .searchwrap,.top .brand');
  showTip({title:el.dataset.tipTitle, kind:el.dataset.tipKind, dot:el.dataset.tipDot, text:el.dataset.tip},
          el.getBoundingClientRect(), (host && host !== el) ? host.getBoundingClientRect() : null);
}
function nodeAnchor(n){
  const cr = canvas.getBoundingClientRect(), k = tf.k, rs = Math.pow(k, -.3);
  const sx = cr.left + n.x*k + tf.x, sy = cr.top + n.y*k + tf.y, rr = n.r*rs*k, w = textW(n.ls.f, n.id);
  let l = sx-rr-3, r = sx+rr+3, t = sy-rr-3, b = sy+rr+3;
  if (n.type === 'field' || n.type === 'root'){ l = Math.min(l, sx-w/2); r = Math.max(r, sx+w/2); t = Math.min(t, sy-rr-n.ls.fs*1.6); }
  else r = Math.max(r, sx+rr+7+w);
  return {left:l, right:r, top:t, bottom:b};
}
function showNodeTip(n){
  if (!n.desc || dragging || hovered !== n) return;
  showTip({kind:kindText(n), dot:GROUPS[n.group].color, title:n.id, text:n.desc}, nodeAnchor(n), null);
}
document.addEventListener('pointerover', e => {
  if (e.pointerType === 'touch') return;
  const el = e.target.closest && e.target.closest('[data-tip]'); if (!el) return;
  clearTimeout(tipTimer); tipTimer = setTimeout(() => tipForEl(el), 280);
});
document.addEventListener('pointerout', e => {
  const el = e.target.closest && e.target.closest('[data-tip]'); if (!el) return;
  if (e.relatedTarget && el.contains(e.relatedTarget)) return;
  hideTip();
});
document.addEventListener('pointerdown', e => {
  longPressed = false; hideTip(); clearTimeout(touchTimer);
  if (e.pointerType === 'touch'){
    const el = e.target.closest && e.target.closest('[data-tip]');
    if (el) touchTimer = setTimeout(() => { longPressed = true; tipForEl(el); tipHideTimer = setTimeout(hideTip, 4500); }, 480);
  }
}, true);
['pointerup','pointercancel'].forEach(t => document.addEventListener(t, () => clearTimeout(touchTimer), true));
document.addEventListener('click', e => { if (longPressed){ longPressed = false; e.preventDefault(); e.stopPropagation(); } }, true);
document.addEventListener('focusin', e => { const el = e.target; if (el.dataset && el.dataset.tip && el.tagName !== 'INPUT' && el.matches(':focus-visible')) tipForEl(el); });
document.addEventListener('focusout', hideTip);
document.addEventListener('input', hideTip);
window.addEventListener('scroll', hideTip, true);

/* ---------- interaction ---------- */
const drag = d3.drag().container(canvas)
  .subject(e => { const n = hit(e.x, e.y); return (n && n.type !== 'root') ? {x:e.x, y:e.y, node:n} : null; })
  .on('start', e => { dragging = true; dismissHint(); hideTip(); if (!e.active) sim.alphaTarget(.25).restart(); const n = e.subject.node; n.fx = (e.x-tf.x)/tf.k; n.fy = (e.y-tf.y)/tf.k; })
  .on('drag',  e => { const n = e.subject.node; n.fx = (e.x-tf.x)/tf.k; n.fy = (e.y-tf.y)/tf.k; })
  .on('end',   e => { dragging = false; if (!e.active) sim.alphaTarget(0); const n = e.subject.node; n.fx = null; n.fy = null; });
d3.select(canvas).call(drag).call(zoom).on('dblclick.zoom', null);

canvas.addEventListener('pointermove', e => {
  if (dragging || e.pointerType !== 'mouse') return;
  const r = canvas.getBoundingClientRect(), n = hit(e.clientX-r.left, e.clientY-r.top);
  if (n !== hovered){ hovered = n; canvas.style.cursor = n ? 'pointer' : ''; updateFocus(); hideTip(); if (n) tipTimer = setTimeout(() => showNodeTip(n), 180); }
});
canvas.addEventListener('pointerleave', () => { hideTip(); if (hovered){ hovered = null; updateFocus(); } });
canvas.addEventListener('click', e => {
  const r = canvas.getBoundingClientRect(), n = hit(e.clientX-r.left, e.clientY-r.top);
  if (n) select(n, {focus:false}); else if (selected) select(null);
});
canvas.addEventListener('dblclick', e => {
  const r = canvas.getBoundingClientRect(), px = e.clientX-r.left, py = e.clientY-r.top, n = hit(px, py);
  if (n) select(n, {focus:true}); else zoomAt(px, py, 1.8);
});
sim.on('tick', requestDraw);

let hintGone = false;
if (window.matchMedia('(hover: none)').matches) $('hint').textContent = 'Tap a node for its description. Pinch to zoom, drag to move. Long-press a control to learn what it does.';
function dismissHint(){ if (hintGone) return; hintGone = true; $('hint').classList.add('gone'); }
setTimeout(dismissHint, 9000);

/* ---------- theme & fonts ---------- */
const mq = window.matchMedia('(prefers-color-scheme: dark)');
const onTheme = () => { readTheme(); requestDraw(); };
if (mq.addEventListener) mq.addEventListener('change', onTheme); else if (mq.addListener) mq.addListener(onTheme);
new MutationObserver(onTheme).observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { measureCache.clear(); requestDraw(); });

/* ---------- boot ---------- */
resize();
if (typeof ResizeObserver !== 'undefined') new ResizeObserver(() => resize()).observe(canvas); else window.addEventListener('resize', resize);
fitNodes(nodes, 0);
sim.alpha(.06).restart();
requestDraw();
})();
</script>
